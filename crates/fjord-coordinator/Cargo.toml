[package]
name = "fjord-coordinator"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CoordinatorStore trait (COORD-001) and in-memory reference backend for fjord"

[dependencies]
object-log.workspace = true
parking_lot.workspace = true
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[features]
default = []
# Postgres-backed CoordinatorStore (ADR-008 default production backend).
# Async-native: tokio-postgres + a deadpool connection pool, so commits to
# different partitions run concurrently (serialized only by per-partition row
# locks). Bridged to the synchronous CoordinatorStore trait the way fjord-log's
# S3BlobStore bridges async S3 — block_in_place + the current runtime handle.
postgres-backend = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:tokio"]

[dev-dependencies]
proptest.workspace = true
