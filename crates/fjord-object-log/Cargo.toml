[package]
name = "fjord-object-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "object-log backed PartitionLog implementation for fjord"

[dependencies]
heimq-broker = { path = "../../../heimq/crates/heimq-broker" }
object-log = { path = "../../../object-log" }
bytes = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
heimq-testkit = { path = "../../../heimq/crates/heimq-testkit" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
