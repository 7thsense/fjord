[package]
name = "fjord-object-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "object-log backed PartitionLog implementation for fjord"

[dependencies]
heimq-broker = { git = "https://github.com/easel/heimq", rev = "f9f4906" }
object-log = { git = "https://github.com/easel/object-log", rev = "e859c8c" } # TODO(release): flip to object-log = "0.1" once published to crates.io
bytes = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
heimq = { git = "https://github.com/easel/heimq", rev = "f9f4906", features = ["test-support"] }
heimq-testkit = { git = "https://github.com/easel/heimq", rev = "f9f4906" }
kafka-protocol = "0.15"
clap = { version = "4", features = ["derive"] }
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
