[package]
name = "fjord-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "fjord produce/fetch path: multiplexed L0 objects sequenced by the coordinator (TD-005/TD-006)"

[dependencies]
fjord-coordinator = { path = "../fjord-coordinator" }
parking_lot = "0.12"
object-log = { git = "https://github.com/easel/object-log", rev = "973d839" } # short-term: GitHub ref; switch to crates.io (object-log = "0.1") once published
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
