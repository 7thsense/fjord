# SPDX-License-Identifier: Apache-2.0

[package]
name = "fjord"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "fjord broker: a stateless Kafka-compatible broker over a pluggable coordinator + object storage (ADR-008)"

[[bin]]
name = "fjord"
path = "src/main.rs"

[dependencies]
heimq.workspace = true
heimq-broker.workspace = true
fjord-coordinator = { workspace = true, features = ["postgres-backend"] }
object-log = { workspace = true, features = ["s3"] }
fjord-heimq-backend.workspace = true
fjord-broker.workspace = true
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true

[dev-dependencies]
rdkafka.workspace = true
tokio = { workspace = true, features = ["full"] }
