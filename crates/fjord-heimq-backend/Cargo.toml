[package]
name = "fjord-heimq-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "heimq-broker backend (LogBackend/OffsetStore) over the fjord coordinator + object storage (ADR-008)"

[dependencies]
heimq-broker = { git = "https://github.com/easel/heimq", rev = "da4b87f" }
fjord-coordinator = { path = "../fjord-coordinator" }
object-log = { git = "https://github.com/easel/object-log", rev = "973d839", features = ["s3"] } # repinned to the 0.2.0 rev in S5(d)
bytes = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = []
# Run conformance/integration against the Postgres coordinator backend.
postgres-backend = ["fjord-coordinator/postgres-backend"]

[dev-dependencies]
kafka-protocol = "0.15"
fjord-broker = { path = "../fjord-broker" }
heimq-testkit = { git = "https://github.com/easel/heimq", rev = "da4b87f" }
heimq = { git = "https://github.com/easel/heimq", rev = "da4b87f", features = ["test-support"] }
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
