# SPDX-License-Identifier: Apache-2.0

[package]
name = "fjord-heimq-backend"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "heimq-broker backend (LogBackend/OffsetStore) over the fjord coordinator + object storage (ADR-008)"

[dependencies]
heimq-broker.workspace = true
fjord-coordinator.workspace = true
object-log = { workspace = true, features = ["s3"] }
bytes.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
default = []
# Run conformance/integration against the Postgres coordinator backend.
postgres-backend = ["fjord-coordinator/postgres-backend"]

[dev-dependencies]
heimq-protocol.workspace = true
fjord-broker.workspace = true
heimq-testkit.workspace = true
heimq = { workspace = true, features = ["test-support"] }
rdkafka.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true
