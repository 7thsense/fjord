[package]
name = "fjord-heimq-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "heimq-broker backend (LogBackend/OffsetStore) over the fjord coordinator + object storage (ADR-008)"

[dependencies]
heimq-broker = { git = "https://github.com/easel/heimq", rev = "cd17c1869c55ddd94b678e19df9ad08b21259372" }
fjord-coordinator = { path = "../fjord-coordinator" }
object-log = { git = "https://github.com/easel/object-log", rev = "bb5dd2e741910c5bdf44d985de8c75cb92186f11", features = ["s3"] }
bytes = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = []
# Run conformance/integration against the Postgres coordinator backend.
postgres-backend = ["fjord-coordinator/postgres-backend"]

[dev-dependencies]
kafka-protocol = "0.15"
fjord-broker = { path = "../fjord-broker" }
heimq-testkit = { git = "https://github.com/easel/heimq", rev = "cd17c1869c55ddd94b678e19df9ad08b21259372" }
heimq = { git = "https://github.com/easel/heimq", rev = "cd17c1869c55ddd94b678e19df9ad08b21259372", features = ["test-support"] }
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
