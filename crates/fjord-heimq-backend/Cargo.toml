[package]
name = "fjord-heimq-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "heimq-broker backend (LogBackend/OffsetStore) over the fjord coordinator + object storage (ADR-008)"

[dependencies]
heimq-broker = { path = "../../../heimq/crates/heimq-broker" }
fjord-coordinator = { path = "../fjord-coordinator" }
fjord-log = { path = "../fjord-log" }
bytes = "1"
parking_lot = "0.12"

[features]
default = []
# Run conformance/integration against the Postgres coordinator backend.
postgres-backend = ["fjord-coordinator/postgres-backend"]

[dev-dependencies]
kafka-protocol = "0.15"
fjord-broker = { path = "../fjord-broker" }
heimq-testkit = { path = "../../../heimq/crates/heimq-testkit" }
heimq = { path = "../../../heimq/crates/heimq", features = ["test-support"] }
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
