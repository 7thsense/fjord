[book]
authors = ["Fjord contributors"]
language = "en"
multilingual = false
src = "src"
title = "Fjord Documentation"

[build]
build-dir = "book"
create-missing = false

[output.html]
additional-css = ["theme/fjord.css"]
default-theme = "light"
git-repository-url = "https://github.com/7thsense/fjord"
git-repository-icon = "fa-github"
preferred-dark-theme = "navy"
site-url = "/fjord/"

[output.html.fold]
enable = true
level = 1
