apiVersion: v2
name: fjord
description: |
  fjord — a stateless, Kafka-compatible broker with the durable log in object
  storage and sequencing/metadata in a pluggable coordinator (Postgres by
  default). Brokers carry no state, so they run as a Deployment + HPA: scaling
  is just changing the replica count — no data to move, no partitions to
  reassign. The cluster is presented to clients as one logical broker at the
  Service address; the Service load-balances connections across pods and any
  pod serves any partition over the shared coordinator + bucket.
type: application
version: 0.1.1
appVersion: "0.1.1"
