{{/* Sensitive broker config: coordinator URL (has the DB password) + S3 keys. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fjord.fullname" . }}
  labels:
    {{- include "fjord.labels" . | nindent 4 }}
type: Opaque
stringData:
  FJORD_COORDINATOR_URL: {{ include "fjord.coordinatorUrl" . | quote }}
  {{- if .Values.minio.enabled }}
  FJORD_S3_ACCESS_KEY: {{ .Values.minio.rootUser | quote }}
  FJORD_S3_SECRET_KEY: {{ .Values.minio.rootPassword | quote }}
  {{- else }}
  FJORD_S3_ACCESS_KEY: {{ .Values.objectStore.accessKey | quote }}
  FJORD_S3_SECRET_KEY: {{ .Values.objectStore.secretKey | quote }}
  {{- end }}
