{{- if eq .Values.mode "multiBroker" }}
{{/* multiBroker: each pod is a distinct Kafka broker with a stable identity.
     broker_id and advertised host are derived from the pod ordinal at startup;
     the peer list (rendered below) is identical across pods. Brokers are still
     stateless (no PVC) — the StatefulSet is only for stable network identity. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fjord.fullname" . }}
  labels:
    {{- include "fjord.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fjord.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "fjord.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fjord.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-coordinator
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "fjord.postgresName" . }} 5432; do echo waiting for postgres; sleep 2; done"]
      {{- end }}
      containers:
        - name: fjord
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: kafka
              containerPort: {{ .Values.broker.port }}
          # Derive this broker's id + advertised host from the pod ordinal, then
          # exec the broker. The peer set is injected via FJORD_PEERS below.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ORD="${HOSTNAME##*-}"
              export FJORD_BROKER_ID="$ORD"
              export FJORD_ADVERTISED_HOST="${HOSTNAME}.{{ include "fjord.headlessName" . }}.{{ .Release.Namespace }}.svc.cluster.local"
              exec fjord{{- range .Values.broker.createTopics }} --create-topic {{ . | quote }}{{- end }}
          env:
            - name: FJORD_HOST
              value: "0.0.0.0"
            - name: FJORD_PORT
              value: {{ .Values.broker.port | quote }}
            - name: FJORD_ADVERTISED_PORT
              value: {{ .Values.broker.port | quote }}
            - name: FJORD_PEERS
              value: {{ include "fjord.peers" . | quote }}
            - name: FJORD_OBJECT_STORE
              value: {{ .Values.objectStore.type | quote }}
            {{- if eq .Values.objectStore.type "s3" }}
            {{- with (include "fjord.s3Endpoint" .) }}
            - name: FJORD_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: FJORD_S3_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: FJORD_S3_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            {{- end }}
            - name: FJORD_FLUSH_TIMEOUT_MS
              value: {{ .Values.broker.flushTimeoutMs | quote }}
            - name: FJORD_FLUSH_MAX_BYTES
              value: {{ .Values.broker.flushMaxBytes | quote }}
            - name: FJORD_FLUSH_MAX_BATCHES
              value: {{ .Values.broker.flushMaxBatches | quote }}
            {{- range $k, $v := .Values.broker.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "fjord.fullname" . }}
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
