# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88.0"
          arguments: --all-features
          command-arguments: --hide-inclusion-graph

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cmake: aws-lc-sys (S3 rustls) + librdkafka.
      # The rdkafka dev-dep uses `cmake-build`, which compiles librdkafka from
      # source and needs the sasl/ssl/zstd/zlib/curl dev headers. rdkafka is only
      # pulled by #[ignore]'d real-Kafka tests, but --all-targets still compiles it.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsasl2-dev libssl-dev libzstd-dev zlib1g-dev libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Postgres/Garage-gated tests self-skip when their env vars are unset;
      # perf + real-Kafka differential tests are #[ignore]. So the default run
      # is hermetic — no external services required.
      - name: Test
        run: cargo test --workspace
      - name: Build broker (release)
        run: cargo build --release -p fjord

  # Verify the production image actually builds against the git deps + .dockerignore.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
