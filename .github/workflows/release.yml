# SPDX-License-Identifier: Apache-2.0

name: Release

# On a version tag (v0.1.0, …): build + push the broker image to GHCR, package
# the Helm chart (release asset + OCI), and attempt to mark packages public.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_tags: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fjord
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make container package public
        continue-on-error: true
        run: |
          # Best-effort: requires package admin. Failures are non-fatal so the
          # release still completes; maintainers can re-run deploy/make-packages-public.sh.
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/fjord/visibility" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package deploy/helm/fjord \
            --version "$VERSION" --app-version "$VERSION" -d dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/fjord-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          ls -la dist
      - name: Push chart to GHCR (OCI)
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          # Nested path avoids clashing with the broker container package name.
          helm push "dist/fjord-${VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Make chart package public
        continue-on-error: true
        run: |
          # helm push to oci://ghcr.io/OWNER/charts creates package charts/fjord
          encoded="$(printf '%s' 'charts/fjord' | jq -sRr @uri)"
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/${encoded}/visibility" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach chart to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TAG="v${VERSION}"
          # Release notes may already exist (manual gh release create); ensure the tag release exists.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Fjord ${TAG}" \
              --generate-notes \
              "${{ steps.package.outputs.tarball }}"
          else
            gh release upload "$TAG" "${{ steps.package.outputs.tarball }}" --clobber
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
