name: Make packages public

# One-shot / occasional maintainer action: mark GHCR packages public so
# anonymous docker/helm pulls work. Safe to re-run.
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for pkg in fjord charts%2Ffjord; do
            echo "PATCH visibility public: $OWNER/$pkg"
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${pkg}/visibility" \
              -f visibility=public; then
              echo "ok: $pkg"
            else
              echo "failed: $pkg (package may not exist yet or token lacks admin)" >&2
            fi
          done
