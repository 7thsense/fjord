[workspace]
members = ["crates/fjord", "crates/fjord-broker", "crates/fjord-coordinator", "crates/fjord-heimq-backend"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
authors = ["Erik LaBianca <erik@telepathdata.com>"]
license = "MIT"
repository = "https://github.com/telepathdata/fjord"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.10"
clap = "4"
deadpool-postgres = "0.14"
fjord-broker = { path = "crates/fjord-broker", version = "0.1.1" }
fjord-coordinator = { path = "crates/fjord-coordinator", version = "0.1.1" }
fjord-heimq-backend = { path = "crates/fjord-heimq-backend", version = "0.1.1" }
heimq = { git = "https://github.com/easel/heimq", rev = "cd17c1869c55ddd94b678e19df9ad08b21259372", version = "0.1.0" }
heimq-broker = { git = "https://github.com/easel/heimq", rev = "cd17c1869c55ddd94b678e19df9ad08b21259372", version = "0.1.0" }
heimq-testkit = { git = "https://github.com/easel/heimq", rev = "cd17c1869c55ddd94b678e19df9ad08b21259372", version = "0.1.0" }
kafka-protocol = "0.15"
object-log = { git = "https://github.com/easel/object-log", rev = "bb5dd2e741910c5bdf44d985de8c75cb92186f11", version = "0.2.0" }
parking_lot = "0.12"
proptest = "1"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
tokio = "1.44"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
