# SPDX-License-Identifier: Apache-2.0

[workspace]
members = ["crates/fjord", "crates/fjord-broker", "crates/fjord-coordinator", "crates/fjord-heimq-backend"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
authors = ["Erik LaBianca"]
license = "Apache-2.0"
repository = "https://github.com/7thsense/fjord"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.10"
clap = "4"
deadpool-postgres = "0.14"
fjord-broker = { path = "crates/fjord-broker", version = "0.1.5" }
fjord-coordinator = { path = "crates/fjord-coordinator", version = "0.1.5" }
fjord-heimq-backend = { path = "crates/fjord-heimq-backend", version = "0.1.5" }
heimq = { git = "https://github.com/easel/heimq", tag = "v0.1.2", version = "0.1.0" }
heimq-broker = { git = "https://github.com/easel/heimq", tag = "v0.1.2", version = "0.1.0" }
heimq-protocol = { package = "heimq-protocol", git = "https://github.com/easel/heimq", tag = "v0.1.2", version = "0.15.1" }
heimq-testkit = { git = "https://github.com/easel/heimq", tag = "v0.1.2", version = "0.1.0" }
object-log = "0.2.0"
parking_lot = "0.12"
proptest = "1"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
tokio = "1.44"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
