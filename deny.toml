# SPDX-License-Identifier: Apache-2.0

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled by Heimq's vendored protocol crate. RustSec lists no patched paste version; remove this when Heimq no longer resolves paste." },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "any"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/easel/heimq",
]
